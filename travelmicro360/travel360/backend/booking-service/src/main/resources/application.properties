spring.application.name=booking-service
spring.config.import=optional:configserver:http://localhost:8888
server.port=8060
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/booking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
jwt.secret=${JWT_SECRET:dev-only-change-me-jwt-secret-min-32-bytes-0123456789}
jwt.expiration-ms=3600000
travel360.cors.allowed-origins=http://localhost:3000,http://localhost:3002
eureka.instance.prefer-ip-address=true

# Resilience4j circuit breaker (used by Feign clients)
feign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.notification-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notification-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.notification-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.compliance-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.compliance-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.compliance-service.sliding-window-size=10
